<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceno Motion Logo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0B0F19;
            color: white;
            font-family: 'system-ui', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        .container {
            width: 1080px;
            height: 1080px;
            position: relative;
            background: radial-gradient(circle at center, #111827 0%, #0B0F19 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transform: scale(min(1, calc(100vh / 1080)));
        }

        /* Cyberpunk Grid */
        .grid {
            position: absolute;
            width: 200%;
            height: 200%;
            bottom: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.2) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(60deg);
            animation: moveGrid 15s linear infinite;
            opacity: 0.3;
        }

        @keyframes moveGrid {
            0% { transform: rotateX(60deg) translateY(0); }
            100% { transform: rotateX(60deg) translateY(60px); }
        }

        /* Rings */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(16, 185, 129, 0.5);
            animation: pulseRing 4s ease-out infinite;
        }

        @keyframes pulseRing {
            0% { width: 200px; height: 200px; opacity: 1; border-width: 4px; }
            100% { width: 800px; height: 800px; opacity: 0; border-width: 1px; }
        }

        .ring:nth-child(2) { animation-delay: 1.33s; }
        .ring:nth-child(3) { animation-delay: 2.66s; }

        /* Icon Container */
        .icon-container {
            width: 256px;
            height: 256px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 64px;
            border: 4px solid;
            border-image: linear-gradient(135deg, #F59E0B, #10B981, #0D9488) 1;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            position: relative;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.3);
            opacity: 0;
            transform: translateY(50px) scale(0.8);
        }

        /* SVG Key */
        .key {
            width: 120px;
            height: 120px;
            fill: #10B981;
            filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.8));
            transform: rotate(45deg);
        }

        /* Typography */
        .title {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 100px;
            font-weight: 700;
            margin-top: 60px;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            font-size: 28px;
            letter-spacing: 12px;
            color: #94A3B8;
            margin-top: 20px;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            font-weight: 600;
        }

        .dot { color: #10B981; text-shadow: 0 0 10px #10B981; }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 40px;
            z-index: 20;
        }

        button {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10B981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        button:hover {
            background: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
        }

        /* Animations */
        .animate .icon-container {
            animation: floatIn 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, float 6s ease-in-out infinite 2s;
        }

        .animate .title {
            animation: slideUpFade 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
        }

        .animate .subtitle {
            animation: slideUpFade 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 1s forwards;
        }

        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(100px) scale(0.8) rotateX(20deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container" id="scene">
    <div class="grid"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    
    <div class="icon-container" style="border: none; background: linear-gradient(#0B0F19, #0B0F19) padding-box, linear-gradient(135deg, #F59E0B, #10B981, #0D9488) border-box; border: 6px solid transparent; border-radius: 64px;">
        <svg class="key" viewBox="0 0 100 100">
            <path d="M72,38 A15,15 0 1,0 50,52 L50,82 L60,82 L60,92 L70,92 L70,82 L76,82 L76,66 L65,55 A15,15 0 0,0 72,38 Z"/>
            <circle cx="60" cy="38" r="5" fill="#0B0F19"/>
        </svg>
    </div>

    <div class="title">لایسـنـو</div>
    <div class="subtitle">LICENO <span class="dot">•</span> LEGAL DIGITAL STORE</div>
    
    <div class="controls">
        <button onclick="replay()">ضبط / بازپخش (Play / Replay)</button>
    </div>
</div>

<script>
    function replay() {
        const scene = document.getElementById('scene');
        scene.classList.remove('animate');
        // Trigger reflow
        void scene.offsetWidth;
        scene.classList.add('animate');
    }
    
    // Start animation on load
    window.onload = () => {
        setTimeout(replay, 500);
    };
</script>

</body>
</html>
