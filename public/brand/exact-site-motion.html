<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; transition: background 0.3s; margin:0;}
  .light { background: #f8fafc; color: #0f172a; }
  .dark { background: #0f172a; color: #f8fafc; }
  .logo-container { cursor: pointer; padding: 2rem; border-radius: 1rem; transition: background 0.3s; }
  .logo-container:hover { background: rgba(0,0,0,0.05); }
  .dark .logo-container:hover { background: rgba(255,255,255,0.05); }
  
  .squircle {
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .key {
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    transform-origin: 12px 12px;
  }
  .sq-border-stop1 { transition: stop-color 0.4s; }
  .sq-border-stop2 { transition: stop-color 0.4s; }
  
  .logo-container:hover .squircle {
    transform: scale(1.06);
  }
  .logo-container:hover .key {
    transform: rotate(0deg); /* From 45 to 0 */
  }
  
  .controls { margin-top: 2rem; gap: 1rem; display: flex; }
  button { padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; background: white; cursor: pointer; }
  .dark button { background: #1e293b; border-color: #334155; color: white; }
</style>
</head>
<body class="light" id="body">
  <div class="logo-container">
    <svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64">
        <defs>
            <linearGradient id="sq-border" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FBBF24" class="sq-border-stop1" />
                <stop offset="50%" stop-color="#10B981" />
                <stop offset="100%" stop-color="#0D9488" class="sq-border-stop2" />
            </linearGradient>
            <filter id="key-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10B981" flood-opacity="0.5"/>
            </filter>
            <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
            </filter>
        </defs>
        
        <g transform="translate(192, 8)">
            <g class="squircle" transform-origin="24 24">
                <rect width="48" height="48" rx="16" fill="rgba(255,255,255,0.95)" stroke="url(#sq-border)" stroke-width="1.5" filter="url(#glass-shadow)" class="sq-rect"/>
                <g transform="translate(12, 12)">
                    <g class="key" transform="rotate(45)">
                        <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" stroke="#10B981" stroke-width="2.2" fill="none" filter="url(#key-glow)" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="16.5" cy="7.5" r="1.5" stroke="#10B981" stroke-width="2.2" fill="none" filter="url(#key-glow)" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                </g>
            </g>
        </g>

        <text x="180" y="32" font-family="Vazirmatn, sans-serif" font-weight="900" font-size="22" fill="#0F172A" text-anchor="end" class="main-text">لایسـنـو</text>
        <text x="180" y="48" font-family="sans-serif" font-weight="500" font-size="10" letter-spacing="0.25em" fill="#64748B" text-anchor="end">LICENO <tspan fill="#10B981">•</tspan> LEGAL STORE</text>
    </svg>
  </div>
  
  <div class="controls">
    <button onclick="document.getElementById('body').classList.toggle('dark'); document.getElementById('body').classList.toggle('light'); updateDark();">Toggle Dark/Light</button>
  </div>

  <script>
    function updateDark() {
        const isDark = document.getElementById('body').classList.contains('dark');
        document.querySelector('.sq-rect').setAttribute('fill', isDark ? 'rgba(15,23,42,0.95)' : 'rgba(255,255,255,0.95)');
        document.querySelector('.main-text').setAttribute('fill', isDark ? '#FFFFFF' : '#0F172A');
    }
  </script>
</body>
</html>
